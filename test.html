<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>О продукции</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #F4F1EB;
      --text-color: #120d31;
      --line-color: #8B9DC3;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: var(--bg-color);
      line-height: 1.6;
    }

    .mountain-about {
      padding: 60px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .about-row {
      display: flex;
      align-items: center;
      gap: 60px;
    }

    .about-img {
      flex: 0 0 50%;
      width: 100%;
    }

    .about-img img {
      width: 100%;
      height: auto;
      display: block;
    }

    .about-text {
      flex: 1;
      position: relative;
      padding-top: 30px;
    }

    .about-text::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 12px;
      background-color: var(--line-color);
    }

    .about-text p {
      color: var(--text-color);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .about-text p:last-child {
      margin-bottom: 0;
    }

    /* Адаптивность */
    @media (max-width: 991px) {
      .mountain-about {
        padding: 40px 20px;
      }

      .about-row {
        flex-direction: column;
        gap: 40px;
      }

      .about-img {
        flex: 0 0 100%;
        max-width: 500px;
        margin: 0 auto;
      }

      .about-text {
        width: 100%;
        padding-top: 20px;
      }

      .about-text::before {
        height: 8px;
      }

      .about-text p {
        font-size: 15px;
      }
    }

    @media (max-width: 576px) {
      .mountain-about {
        padding: 30px 15px;
      }

      .about-row {
        gap: 30px;
      }

      .about-img {
        max-width: 100%;
      }

      .about-text p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <section class="mountain-about">
    <div class="about-row">
      
      <div class="about-img">
        <!-- Замените src на путь к вашему изображению -->
        <img src="mountains.svg" alt="Горы и деревья">
      </div>

      <div class="about-text">
        <p>Все модели проходят испытания на прочность и удобство в условиях, максимально приближённых к реальным.</p>
        <p>Каждая пара обуви и каждое изделие одежды выходят к вам проверенными, надёжными и готовыми к любым вызовам.</p>
      </div>

    </div>
  </section>

</body>
</html>
